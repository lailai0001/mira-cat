name: Build XPTV Bundle

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/index.js dist/index.js.md5
          git diff --cached --quiet || git commit -m "auto-build: update dist bundle"
          git push
