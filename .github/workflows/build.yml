name: Build CatPawOpen Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: ./nodejs
        run: npm ci
        
      - name: Build bundle
        working-directory: ./nodejs
        run: npm run build
        
      - name: Generate MD5
        run: |
          cd nodejs/dist
          JS_FILE=$(ls *.js | head -1)
          if [ -n "$JS_FILE" ]; then
            md5sum "$JS_FILE" | cut -d' ' -f1 > "${JS_FILE}.md5"
            echo "Generated ${JS_FILE}.md5"
            ls -lh
          fi
          
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: nodejs/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
