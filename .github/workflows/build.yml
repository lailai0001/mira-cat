name: Build XPTV Bundle

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify bundle integrity
        run: |
          python3 - <<'EOF'
          import hashlib
          data = open('dist/index.js','rb').read()
          md5 = hashlib.md5(data).hexdigest()
          expect = open('dist/index.js.md5').read().strip()
          assert md5 == expect, f"MD5 mismatch: {md5} != {expect}"
          # 确认直播源和配置页面不在注册表中
          text = data.decode('utf-8', errors='ignore')
          assert 'jq,xq]' not in text, "注册表中仍有 jq,xq"
          print(f"OK: bundle {len(data)} bytes, md5 {md5}")
          EOF

      - name: Summary
        run: |
          echo "Bundle 校验通过。当前为补丁版（基于 fangkuia 包移除 jq/xq）。"
          echo "js/ 目录为 XPTV 格式源文件存档，供参考；实际生效的是 dist/index.js。"
