# javneon 镜像定时刷新
#
# 原因：javneon.tv 的 Cloudflare 机器人验证拦 App 请求与 Worker 中转，
# 只有常规客户端（curl）能抓到内容。由本 workflow 定时（每 6 小时 +
# 手动触发）用 curl 预抓各分类列表与详情按钮，写成静态 JSON 提交回仓库，
# App 端蜘蛛从 ghfast/raw 读镜像，不再实时碰 javneon.tv。
# 镜像只覆盖每分类前 2 页（共约 48 条）；更深的页码与搜索走镜像内筛选。
name: javneon-mirror

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch javneon lists and details
        run: node mirror/javneon/fetch.mjs
      - name: Commit mirror if changed
        if: always()
        run: |
          git config user.name "javneon-mirror"
          git config user.email "javneon-mirror@users.noreply.github.com"
          git add mirror/javneon/
          if git diff --cached --quiet; then
            echo "mirror unchanged"
          else
            git commit -m "mirror(javneon): refresh lists and details"
            git push || (git pull --rebase && git push)
          fi
